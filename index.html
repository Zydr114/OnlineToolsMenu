<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta

    <meta property="og:title" content="Talium / 在线工具箱" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
    <title>Talium / 在线工具箱</title>

  <body>
    <a class="skip-link" href="#tools">跳至工具</a>

      <symbol id="i-sun" viewBox="0 0 24 24">

      <symbol id="i-close" viewBox="0 0 24 24">

    <div class="site-shell">
      <header class="header">
        <a class="wordmark" href="/" aria-label="Talium 工具箱首页"
          ><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M3 3h12v12H3zM17 17h12v12H17z" />
            <path d="M17 3h12v12H17zM3 17h12v12H3z" /></svg
          ><span>talium<span class="wordmark-dot">.</span></span></a
        >
        <nav class="main-nav" aria-label="主导航">
          <a class="nav-link active" href="#tools">工具</a
          ><button class="nav-link" type="button" data-about-open>关于</button>
        </nav>
        <div class="header-actions">
          <button
            class="icon-button search-trigger"
            type="button"
            aria-label="搜索工具"
            title="搜索工具（Ctrl / ⌘ K）"
          >
            <svg class="icon"><use href="#i-search" /></svg><kbd>⌘ K</kbd>
          </button>
          <span class="action-divider" aria-hidden="true"></span>
          <button
            class="icon-button theme-toggle"
            type="button"
            aria-label="切换到深色模式"
            title="切换到深色模式"
          >
            <svg class="icon theme-sun"><use href="#i-sun" /></svg
            ><svg class="icon theme-moon"><use href="#i-moon" /></svg>
          </button>
        </div>
      </header>
      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <span class="hero-label enter" style="--order: 0"
              ><span class="status-dot" aria-hidden="true"></span>ONLINE
              TOOLS</span
            >
            <h1 id="hero-title" class="enter" style="--order: 1">
              工具箱<span class="hero-period" aria-hidden="true">.</span>
            </h1>
            <a
              href="#tools"
              class="index-link enter"
              style="--order: 2"
              aria-label="查看工具"
              ><span class="index-rule" aria-hidden="true"></span
              ><span class="index-count">01</span
              ><svg class="icon"><use href="#i-down" /></svg
            ></a>
          </div>
          <div class="hero-art enter" style="--order: 1">
            <span class="crosshair crosshair-tl" aria-hidden="true"></span
            ><span class="crosshair crosshair-br" aria-hidden="true"></span>
            <span class="axis axis-x" aria-hidden="true"></span
            ><span class="axis axis-y" aria-hidden="true"></span>

              class="geometry-button"
              type="button"
              aria-label="变换几何结构"
              aria-pressed="false"

                /></svg
              ><canvas class="geometry-canvas" aria-hidden="true"></canvas>
            </button>
          </div>
        </section>
        <section class="tool-section" id="tools" aria-labelledby="tools-title">
          <div class="collection-toolbar reveal">
            <h2 id="tools-title">全部工具<span class="count">01</span></h2>
            <button
              class="collection-search"
              type="button"
              aria-label="搜索工具"
            >
              <svg class="icon"><use href="#i-search" /></svg><span>搜索</span
              ><kbd>/</kbd>
            </button>
          </div>
          <article
            class="tool-card reveal"
            data-tool-title="MakoLrc Studio"
            data-tool-keywords="歌词 逐字 逐行 打轴 音乐 音频 编辑器 LRC TTML ASS 罗马音 注音 makolrc mako lrc studio"
          >
            <div class="tool-info">
              <div class="tool-card-top">
                <span class="tool-logo" aria-hidden="true"
                  ><svg class="icon"><use href="#i-wave" /></svg></span
                ><span class="tool-number">001</span>
              </div>
              <h3>MakoLrc <span>Studio</span></h3>
              <p class="tool-description">歌词编辑与逐字打轴</p>
              <div class="tool-meta">
                <span>LRC</span><span>TTML</span><span>ASS</span
                ><span class="meta-divider" aria-hidden="true"></span
                ><span class="local-label"
                  ><svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                    <rect x="3" y="7" width="10" height="7" rx="1" />
                    <path d="M5 7V4a3 3 0 0 1 6 0v3" /></svg
                  >本地处理</span
                >
              </div>
              <a
                class="launch-button"
                href="https://tool.talium.site/MakoLrcStudio/"
                aria-label="打开 MakoLrc Studio"
                ><svg class="icon"><use href="#i-arrow" /></svg
              ></a>
            </div>
            <div
              class="tool-visual"
              role="img"
              aria-label="音频波形与逐字时间轴示意"
            >
              <div class="signal-grid" aria-hidden="true"></div>
              <div class="signal-diagram" aria-hidden="true">
                <div class="signal-baseline"></div>
                <div class="waveform"></div>
                <div class="signal-segments">
                  <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                </div>
                <div class="signal-playhead"><span></span></div>
              </div>
            </div>
          </article>
        </section>
      </main>
      <footer class="footer">
        <span class="copyright">© <span id="year">2026</span> Talium</span>
        <div class="footer-actions">
          <button
            class="icon-button motion-toggle"
            type="button"
            aria-pressed="true"
            aria-label="动效已开启"
            title="关闭动效"
          >
            <span class="motion-indicator" aria-hidden="true"
              ><i></i><i></i><i></i><i></i
            ></span></button
          ><a
            class="github-link"
            href="https://github.com/Zydr114/OnlineToolsMenu"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub 源码（新标签页）"
            >GitHub<svg class="icon"><use href="#i-arrow" /></svg></a
          ><a
            href="#hero-title"
            class="icon-button back-top"
            aria-label="回到顶部"
            ><svg class="icon"><use href="#i-down" /></svg
          ></a>
        </div>
      </footer>
    </div>
    <dialog class="search-dialog" aria-labelledby="search-title">
      <div class="search-field">
        <svg class="icon"><use href="#i-search" /></svg
        ><label class="sr-only" id="search-title" for="tool-search"
          >搜索工具</label
        ><input
          id="tool-search"
          type="search"
          placeholder="搜索工具"
          autocomplete="off"
        /><button class="dialog-close" type="button" aria-label="关闭搜索">
          <kbd>Esc</kbd>
        </button>
      </div>
      <div class="search-content">
        <p class="search-section-label">
          工具<span id="result-count">1 个工具</span>
        </p>
        <a class="search-result" href="https://tool.talium.site/MakoLrcStudio/"
          ><span class="result-icon"
            ><svg class="icon"><use href="#i-wave" /></svg></span
          ><span
            ><strong>MakoLrc Studio</strong
            ><small>歌词编辑与逐字打轴</small></span
          ><svg class="icon result-arrow"><use href="#i-arrow" /></svg
        ></a>
        <div class="search-empty" hidden>
          <svg class="icon"><use href="#i-search" /></svg>
          <p>无匹配工具</p>
        </div>
        <p
          class="sr-only search-announcement"
          role="status"
          aria-live="polite"
        ></p>
      </div>
      <div class="search-footer">
        <span><kbd>↓</kbd><kbd>↑</kbd> 选择 <kbd>↵</kbd> 打开</span
        ><kbd>Esc</kbd>
      </div>
    </dialog>
    <dialog class="about-dialog" aria-labelledby="about-title">
      <button
        class="icon-button dialog-close"
        type="button"
        aria-label="关闭关于"
      >
        <svg class="icon"><use href="#i-close" /></svg></button
      ><span class="about-index" aria-hidden="true">/</span>
      <h2 id="about-title">Talium</h2>
      <p>个人在线工具箱。</p>
      <dl class="about-details">
        <div>
          <dt>工具</dt>
          <dd>MakoLrc Studio</dd>
        </div>
        <div>
          <dt>源码</dt>
          <dd>
            <a
              href="https://github.com/Zydr114/OnlineToolsMenu"
              target="_blank"
              rel="noopener noreferrer"
              >GitHub<svg class="icon"><use href="#i-arrow" /></svg
            ></a>
          </dd>
        </div>
      </dl>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
